---
# SEV Host Setup for Recording Oracle
# Configures AMD SEV-SNP on the bare metal host

- name: Check CPU vendor is AMD
  ansible.builtin.shell:
    cmd: grep -m1 'vendor_id' /proc/cpuinfo | grep -q AMD
  register: cpu_vendor
  changed_when: false
  failed_when: false

- name: Fail if not AMD CPU
  ansible.builtin.fail:
    msg: "SEV requires AMD EPYC processor. Found non-AMD CPU."
  when: cpu_vendor.rc != 0

- name: Check for SEV CPU flags
  ansible.builtin.shell:
    cmd: grep -E 'sev|sev_es|sev_snp' /proc/cpuinfo | head -1
  register: sev_flags
  changed_when: false
  failed_when: false

- name: Display SEV CPU flags
  ansible.builtin.debug:
    msg: "SEV CPU flags: {{ sev_flags.stdout | default('none found') }}"

- name: Warn if SEV flags not found
  ansible.builtin.debug:
    msg: "WARNING: SEV CPU flags not found in /proc/cpuinfo. SEV may need BIOS enablement."
  when: sev_flags.stdout | length == 0

- name: Load required kernel modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ sev_kernel_modules }}"
  become: true

- name: Ensure kernel modules load on boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/sev.conf
    line: "{{ item }}"
    create: true
    mode: '0644'
  loop: "{{ sev_kernel_modules }}"
  become: true

# Configure kernel parameters for SEV-SNP
- name: Check current kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: current_cmdline

- name: Display current kernel parameters
  ansible.builtin.debug:
    msg: "Current cmdline: {{ current_cmdline.content | b64decode }}"

- name: Check if SEV kernel parameters are set
  ansible.builtin.set_fact:
    sev_params_needed: "{{ 'kvm_amd.sev=1' not in (current_cmdline.content | b64decode) }}"
    snp_params_needed: "{{ 'kvm_amd.sev_snp=1' not in (current_cmdline.content | b64decode) }}"

- name: Read current GRUB config
  ansible.builtin.slurp:
    src: /etc/default/grub
  register: grub_config
  become: true

- name: Configure GRUB for SEV-SNP
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash mem_encrypt=on kvm_amd.sev=1 kvm_amd.sev_snp=1 kvm_amd.sev_es=1"'
    backup: true
  become: true
  register: grub_updated
  when: sev_params_needed or snp_params_needed

# Note: SEV-SNP requires iommu=on (not passthrough) but some firmware has init issues
# with this setting. If SEV-SNP is required, enable_snp_iommu can be set to true,
# but this may cause SEV to fail on some hosts (OVH firmware issue).
- name: Configure IOMMU for SEV-SNP (optional)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: 'iommu=pt'
    replace: 'iommu=on amd_iommu=on'
    backup: true
  become: true
  register: iommu_updated
  when: enable_snp_iommu | default(false) | bool

- name: Warn about IOMMU passthrough mode
  ansible.builtin.debug:
    msg: |
      WARNING: IOMMU is in passthrough mode (iommu=pt).
      SEV-SNP requires iommu=on, but some firmware (OVH) has init issues.
      Basic SEV and SEV-ES will work, but SEV-SNP attestation is disabled.
      To try enabling SNP: set enable_snp_iommu=true (may cause SEV init failures).
  when: "'iommu=pt' in (current_cmdline.content | b64decode)"

- name: Update GRUB
  ansible.builtin.command:
    cmd: update-grub
  become: true
  when: grub_updated.changed or (iommu_updated.changed | default(false))
  register: grub_update_result

- name: Display GRUB update result
  ansible.builtin.debug:
    msg: "GRUB updated. Reboot required for SEV-SNP to be enabled."
  when: grub_updated.changed

- name: Set reboot required fact
  ansible.builtin.set_fact:
    reboot_required: "{{ (grub_updated.changed | default(false)) or (iommu_updated.changed | default(false)) }}"

- name: Check if SEV device exists
  ansible.builtin.stat:
    path: "{{ sev_device_path }}"
  register: sev_device

- name: Display SEV device status
  ansible.builtin.debug:
    msg: "SEV device {{ sev_device_path }}: {{ 'exists' if sev_device.stat.exists else 'NOT FOUND' }}"

- name: Fail if SEV device not found
  ansible.builtin.fail:
    msg: |
      SEV device {{ sev_device_path }} not found.

      Possible causes:
      1. SEV not enabled in BIOS - Enable AMD SME/SEV in BIOS settings
      2. Kernel too old - Need kernel 5.19+ for SEV-SNP
      3. Missing kernel parameters - Add 'mem_encrypt=on kvm_amd.sev=1' to GRUB_CMDLINE_LINUX

      To enable, edit /etc/default/grub:
        GRUB_CMDLINE_LINUX="mem_encrypt=on kvm_amd.sev=1"
      Then run: update-grub && reboot
  when: not sev_device.stat.exists

- name: Install SEV-related packages
  ansible.builtin.apt:
    name: "{{ sev_packages }}"
    state: present
    update_cache: true
  become: true

# Install HWE edge kernel for SEV-SNP support (requires kernel 6.10+)
- name: Check current kernel version
  ansible.builtin.shell:
    cmd: uname -r
  register: current_kernel
  changed_when: false

- name: Display current kernel
  ansible.builtin.debug:
    msg: "Current kernel: {{ current_kernel.stdout }}"

- name: Check if kernel upgrade needed for SEV-SNP
  ansible.builtin.set_fact:
    kernel_upgrade_needed: "{{ current_kernel.stdout is version('6.10', '<') }}"

- name: Install HWE edge kernel for SEV-SNP support
  ansible.builtin.apt:
    name:
      - linux-image-generic-hwe-24.04-edge
      - linux-headers-generic-hwe-24.04-edge
    state: present
  become: true
  register: kernel_installed
  when: kernel_upgrade_needed

- name: Set kernel reboot flag
  ansible.builtin.set_fact:
    kernel_reboot_required: "{{ kernel_installed.changed | default(false) }}"

- name: Check OVMF firmware exists
  ansible.builtin.stat:
    path: "{{ ovmf_code_path }}"
  register: ovmf_check

- name: Display OVMF status
  ansible.builtin.debug:
    msg: "OVMF firmware: {{ 'found at ' + ovmf_code_path if ovmf_check.stat.exists else 'NOT FOUND' }}"

- name: Set SEV device permissions
  ansible.builtin.file:
    path: "{{ sev_device_path }}"
    owner: root
    group: "{{ libvirt_group }}"
    mode: '0660'
  become: true
  when: sev_device.stat.exists

- name: Create udev rule for SEV device permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/71-sev.rules
    content: |
      # Allow kvm group access to SEV device
      KERNEL=="sev", GROUP="kvm", MODE="0660"
    mode: '0644'
  become: true
  notify: Reload udev rules

- name: Ensure libvirt is running
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started
  become: true

- name: Check SEV capability via virsh
  ansible.builtin.command:
    cmd: virsh domcapabilities --machine q35 --virttype kvm
  register: domcaps
  changed_when: false
  failed_when: false
  become: true

- name: Check for SEV-SNP support in capabilities
  ansible.builtin.set_fact:
    sev_snp_supported: "{{ 'sev-snp' in domcaps.stdout }}"
    sev_supported: "{{ 'sev' in domcaps.stdout }}"

- name: Display SEV support status
  ansible.builtin.debug:
    msg: |
      SEV Support Status:
        SEV: {{ 'supported' if sev_supported else 'NOT supported' }}
        SEV-SNP: {{ 'supported' if sev_snp_supported else 'NOT supported' }}

- name: Get SEV platform info
  ansible.builtin.shell:
    cmd: |
      if [ -f /sys/kernel/debug/sev/firmware_version ]; then
        echo "Firmware: $(cat /sys/kernel/debug/sev/firmware_version 2>/dev/null || echo 'N/A')"
      fi
      dmesg | grep -i "SEV\|AMD Memory Encryption" | tail -5
  register: sev_info
  changed_when: false
  failed_when: false
  become: true

- name: Display SEV platform info
  ansible.builtin.debug:
    var: sev_info.stdout_lines
  when: sev_info.stdout_lines is defined

# Reboot if kernel was upgraded or kernel parameters were updated
- name: Reboot to apply kernel upgrade or parameters
  ansible.builtin.reboot:
    msg: "Rebooting to enable SEV-SNP (kernel upgrade or parameters)"
    reboot_timeout: 300
  become: true
  when: (reboot_required | default(false)) or (kernel_reboot_required | default(false))

- name: Wait for system to come back
  ansible.builtin.wait_for_connection:
    timeout: 300
  when: (reboot_required | default(false)) or (kernel_reboot_required | default(false))

- name: Check new kernel version after reboot
  ansible.builtin.shell:
    cmd: uname -r
  register: new_kernel
  changed_when: false
  when: kernel_reboot_required | default(false)

- name: Display new kernel version
  ansible.builtin.debug:
    msg: "New kernel: {{ new_kernel.stdout }}"
  when: kernel_reboot_required | default(false) and new_kernel.stdout is defined

- name: Verify SEV-SNP after reboot
  ansible.builtin.shell:
    cmd: dmesg | grep -i "SEV-SNP\|sev_snp\|SEV API" | head -10
  register: snp_check
  changed_when: false
  failed_when: false
  become: true
  when: (reboot_required | default(false)) or (kernel_reboot_required | default(false))

- name: Display SEV-SNP status after reboot
  ansible.builtin.debug:
    var: snp_check.stdout_lines
  when: ((reboot_required | default(false)) or (kernel_reboot_required | default(false))) and snp_check.stdout_lines is defined

- name: Verify SEV-SNP in virsh capabilities after reboot
  ansible.builtin.command:
    cmd: virsh domcapabilities --machine q35 --virttype kvm
  register: domcaps_after
  changed_when: false
  failed_when: false
  when: (reboot_required | default(false)) or (kernel_reboot_required | default(false))

- name: Check for SEV-SNP support after reboot
  ansible.builtin.debug:
    msg: "SEV-SNP {{ 'SUPPORTED' if 'sev-snp' in domcaps_after.stdout else 'not available' }} after kernel upgrade"
  when: ((reboot_required | default(false)) or (kernel_reboot_required | default(false))) and domcaps_after.stdout is defined
